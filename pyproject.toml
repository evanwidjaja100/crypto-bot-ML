[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-bot"
version = "0.1.0"
description = "Modular Bybit trading bot with ML: data, features, models, backtesting, execution"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pybit>=5.8,<6",
    "pandas>=2.2,<2.4",
    "numpy>=1.26,<2.2",
    "pyarrow>=14,<19",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.7,<5",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
